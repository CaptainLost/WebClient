<div class="h-full flex flex-col items-center justify-center gap-4">
  <p-card class="p-8 w-full max-w-md">
    <div>
      <h1 class="text-3xl font-semibold mb-2" style="color: var(--text-color)">Log in</h1>
      <p class="text-sm" style="color: var(--text-color-secondary)">Please enter your details</p>
    </div>

    <p-divider />

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <p-floatlabel variant="on">
        <p-iconfield>
          <p-inputicon class="pi pi-user" />
          <input 
            pInputText 
            id="username_input" 
            formControlName="username"
            autocomplete="off" 
            class="w-full" 
          />
          <label for="username_input">Username</label>
        </p-iconfield>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-iconfield>
          <p-inputicon class="pi pi-lock" />
          <p-password 
            inputId="username_password" 
            formControlName="password"
            [feedback]="false" 
            [toggleMask]="true" 
            inputStyleClass="w-full"
            class="w-full" 
          />
          <label for="username_password">Password</label>
        </p-iconfield>
      </p-floatlabel>

      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <p-checkbox 
            inputId="remember_me" 
            [binary]="true"
            formControlName="isPersistent"
          />
          <label for="remember_me" class="text-sm cursor-pointer" style="color: var(--text-color)">Remember Me</label>
        </div>
        <a class="text-sm cursor-pointer" style="color: var(--primary-color)">Reset password</a>
      </div>

      <div class="flex gap-4 mt-1">
        <p-button 
          type="submit"
          label="Log In" 
          severity="primary" 
          class="w-full" 
          styleClass="w-full"
          [disabled]="loginForm.invalid"
        />
      </div>
    </form>
  </p-card>
</div>
